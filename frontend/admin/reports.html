<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — BloodLink Admin</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div id="site-header"></div></header>

<div class="dash-shell">
  <nav class="dash-sidebar" id="dash-sidebar"></nav>
  <main class="dash-main">
    <h1>Reports</h1>
    <div id="alert-box"></div>
    <div id="list"></div>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/js/services/apiClient.js"></script>
<script src="/js/services/auth.js"></script>
<script src="/js/services/admin.js"></script>
<script src="/js/app.js"></script>
<script>
const session = AuthService.requireRole(["admin"]);
renderDashSidebar("/admin/reports.html", [
  ["/admin/dashboard.html", "Dashboard"],
  ["/admin/users.html", "User Management"],
  ["/admin/donors.html", "Donor Management"],
  ["/admin/hospitals.html", "Hospital Verification"],
  ["/admin/requests.html", "Blood Requests"],
  ["/admin/reports.html", "Reports"],
  ["/admin/notifications.html", "Notifications"],
]);

const alertBox = document.getElementById("alert-box");
const listEl = document.getElementById("list");
const STATUS_OPTIONS = ["open", "reviewing", "resolved", "dismissed"];

async function load() {
  clearAlert(alertBox);
  try {
    const reports = await AdminService.listReports();
    listEl.innerHTML = reports.length ? "" : `<div class="empty-state">No reports filed.</div>`;
    reports.forEach(r => {
      const card = document.createElement("div");
      card.className = "card mt-16";
      card.innerHTML = `
        <div class="flex-between" style="flex-wrap:wrap; gap:12px;">
          <div>
            <strong>${escapeHtml(r.reason)}</strong>
            ${r.request_id ? ` — Request #${r.request_id}` : ""}
            <div class="muted" style="font-size:0.85rem;">Filed by user ${r.reporter_id} on ${fmtDateTime(r.created_at)}</div>
            ${r.description ? `<p class="mt-8 mb-0">${escapeHtml(r.description)}</p>` : ""}
          </div>
          <select data-id="${r.id}" style="width:auto;">
            ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}
          </select>
        </div>
      `;
      listEl.appendChild(card);
    });
    listEl.querySelectorAll("select[data-id]").forEach(sel => {
      sel.addEventListener("change", async () => {
        try { await AdminService.updateReport(sel.dataset.id, sel.value); }
        catch (e) { showAlert(alertBox, e.message); }
      });
    });
  } catch (e) {
    showAlert(alertBox, e.message);
  }
}
load();
</script>
</body>
</html>
