<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donor Management — BloodLink Admin</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div id="site-header"></div></header>

<div class="dash-shell">
  <nav class="dash-sidebar" id="dash-sidebar"></nav>
  <main class="dash-main">
    <h1>Donor management</h1>
    <div id="alert-box"></div>
    <div class="card">
      <table>
        <thead><tr><th>ID</th><th>Blood group</th><th>City</th><th>Age</th><th>Available</th><th>Total donations</th><th>Response rate</th><th>Last donation</th></tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/js/services/apiClient.js"></script>
<script src="/js/services/auth.js"></script>
<script src="/js/services/admin.js"></script>
<script src="/js/app.js"></script>
<script>
const session = AuthService.requireRole(["admin"]);
renderDashSidebar("/admin/donors.html", [
  ["/admin/dashboard.html", "Dashboard"],
  ["/admin/users.html", "User Management"],
  ["/admin/donors.html", "Donor Management"],
  ["/admin/hospitals.html", "Hospital Verification"],
  ["/admin/requests.html", "Blood Requests"],
  ["/admin/reports.html", "Reports"],
  ["/admin/notifications.html", "Notifications"],
]);

const alertBox = document.getElementById("alert-box");
const rows = document.getElementById("rows");

async function load() {
  try {
    const donors = await AdminService.listDonors();
    rows.innerHTML = donors.map(d => `
      <tr>
        <td>${d.id}</td><td>${d.blood_group}</td><td>${escapeHtml(d.city)}</td><td>${d.age}</td>
        <td>${d.is_available ? `<span class="badge badge-verified">Available</span>` : `<span class="badge badge-neutral">Unavailable</span>`}</td>
        <td>${d.total_donations}</td>
        <td>${Math.round(d.historical_response_rate * 100)}%</td>
        <td>${fmtDate(d.last_donation_date)}</td>
      </tr>
    `).join("") || `<tr><td colspan="8" class="muted">No donors registered yet.</td></tr>`;
  } catch (e) {
    showAlert(alertBox, e.message);
  }
}
load();
</script>
</body>
</html>
