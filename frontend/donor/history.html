<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation History — BloodLink</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div id="site-header"></div></header>

<div class="dash-shell">
  <nav class="dash-sidebar" id="dash-sidebar"></nav>
  <main class="dash-main">
    <h1>Donation history</h1>
    <p>Completed donations, recorded when a recipient marks a request fulfilled.</p>
    <div id="alert-box"></div>

    <div class="card">
      <table>
        <thead><tr><th>Date</th><th>Request</th><th>Hospital</th><th>Units</th></tr></thead>
        <tbody id="history-body"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/js/services/apiClient.js"></script>
<script src="/js/services/auth.js"></script>
<script src="/js/services/donor.js"></script>
<script src="/js/services/hospital.js"></script>
<script src="/js/app.js"></script>
<script>
const session = AuthService.requireRole(["donor"]);
renderDashSidebar("/donor/history.html", [
  ["/donor/dashboard.html", "Dashboard"],
  ["/donor/profile.html", "Profile"],
  ["/donor/availability.html", "Availability"],
  ["/donor/requests.html", "Incoming Requests"],
  ["/donor/history.html", "Donation History"],
  ["/donor/report.html", "Report a Problem"],
  ["/donor/notifications.html", "Notifications"],
]);

const alertBox = document.getElementById("alert-box");
const body = document.getElementById("history-body");

async function load() {
  try {
    const [rows, hospitals] = await Promise.all([DonorService.getHistory(), HospitalService.list({ verified_only: false })]);
    const hname = Object.fromEntries(hospitals.map(h => [h.id, h.name]));
    body.innerHTML = rows.length ? rows.map(r => `
      <tr><td>${fmtDate(r.donation_date)}</td><td>#${r.request_id ?? "—"}</td>
      <td>${escapeHtml(hname[r.hospital_id] || "—")}</td><td>${r.units_donated}</td></tr>`).join("")
      : `<tr><td colspan="4" class="muted">No completed donations yet.</td></tr>`;
  } catch (e) { showAlert(alertBox, e.message); }
}
load();
</script>
</body>
</html>
