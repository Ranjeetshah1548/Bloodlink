<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify phone — BloodLink</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div id="site-header"></div></header>
<section class="section-tight">
  <div class="container" style="max-width:420px;">
    <h1>Verify your phone</h1>
    <p>We sent a one-time code to <strong id="phone-label"></strong>. Enter it below.</p>
    <div class="card mt-24">
      <div id="alert-box"></div>
      <form id="otp-form">
        <div class="field">
          <label for="code">6-digit code</label>
          <input id="code" inputmode="numeric" maxlength="6" pattern="\d{6}" required autocomplete="one-time-code" placeholder="123456">
          <div class="hint">Development mode: the code is printed in the backend server console (<code>OTP_PROVIDER=console</code>).</div>
        </div>
        <button class="btn btn-accent btn-block" type="submit" id="submit-btn">Verify</button>
      </form>
      <p class="mt-16 text-center mb-0"><a href="#" id="skip">Skip for now</a></p>
    </div>
  </div>
</section>
<footer class="site-footer"><div id="site-footer"></div></footer>
<script src="/js/config.js"></script>
<script src="/js/services/apiClient.js"></script>
<script src="/js/services/auth.js"></script>
<script src="/js/app.js"></script>
<script>
const q = new URLSearchParams(location.search);
const phone = q.get("phone"), role = q.get("role");
const dash = { donor: "/donor/dashboard.html", recipient: "/recipient/dashboard.html" }[role] || "/index.html";
document.getElementById("phone-label").textContent = phone || "";
document.getElementById("skip").href = dash;
const alertBox = document.getElementById("alert-box");
document.getElementById("otp-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAlert(alertBox);
  try {
    await AuthService.verifyOtp({ phone, code: document.getElementById("code").value.trim() });
    showAlert(alertBox, "Phone verified. Redirecting…", "success");
    setTimeout(() => location.href = dash, 700);
  } catch (err) { showAlert(alertBox, err.message); }
});
</script>
</body>
</html>
